name: Live E2E
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Check the contract
        run: genvm-lint check contracts/foreman.py
      - name: Run live E2E on Studionet
        run: |
          python scripts/e2e_live.py \
            --fixture-base "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/e2e/fixtures"
      - name: Commit report
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add reports/e2e-report.md reports/e2e-report.json
          git diff --cached --quiet || git commit -m "docs: live E2E report"
          git push
